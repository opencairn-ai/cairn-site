<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f9f6f1">
<script>
  // Sets the theme before the first paint: the visitor's last choice, else the system setting.
  (function () {
    var theme;
    try { theme = localStorage.getItem("cairn-theme"); } catch (e) {}
    if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = theme;
  })();
</script>
<!-- Title and description are replaced at load time from copy/en.js or copy/fr.js;
     the English values here serve link previews and crawlers that do not run scripts. -->
<title>Cairn: Hello World</title>
<meta name="description" content="An open architecture to run AI models and agents on infrastructure that your organization controls. Components follow clear interface contracts, so you do not depend on one project or vendor. A Mozilla × Mila research collaboration.">
<meta property="og:type" content="website">
<meta property="og:title" content="Cairn: Hello World">
<meta property="og:description" content="An open architecture to run AI models and agents on infrastructure that your organization controls. Components follow clear interface contracts, so you do not depend on one project or vendor. A Mozilla × Mila research collaboration.">
<meta property="og:url" content="https://opencairn.ai/">
<!-- Share card: supplied image at public/assets/og-card.png. The HTML in reference/og-card/ is the previous card. -->
<meta property="og:image" content="https://opencairn.ai/assets/og-card.png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="537">
<meta property="og:image:alt" content="The sovereign, open source AI stack. A Mozilla × Mila research collaboration.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://opencairn.ai/assets/og-card.png">
<link rel="canonical" href="https://opencairn.ai/">
<link rel="alternate" hreflang="en" href="https://opencairn.ai/?lang=en">
<link rel="alternate" hreflang="fr-CA" href="https://opencairn.ai/?lang=fr">
<link rel="alternate" hreflang="x-default" href="https://opencairn.ai/">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preload" href="fonts/SpaceGrotesk-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="hello">
<div class="page">

  <header class="site-header">
    <a class="codename" href="./" data-page="hello"><img class="logo--light" src="assets/cairn-logo-light.png" alt="Codename: Cairn" width="846" height="104"><img class="logo--dark" src="assets/cairn-logo-dark.png" alt="Codename: Cairn" width="846" height="104"></a>
    <!-- The tabs: the same four links on every page. The script marks the current one. -->
    <nav class="site-nav" data-aria-label="nav.label">
      <a href="./" data-page="hello" data-text="nav.hello"></a>
      <a href="stack.html" data-page="stack" data-text="nav.stack"></a>
      <a href="recipes.html" data-page="recipes" data-text="nav.recipes"></a>
      <a href="roadmap.html" data-page="roadmap" data-text="nav.roadmap"></a>
    </nav>
    <div class="prefs">
      <!-- One language button: the script hides the link to the current language,
           so the button shows the language a click switches to. -->
      <nav class="lang" data-aria-label="header.languageLabel">
        <a href="?lang=en" hreflang="en" lang="en" title="English">EN</a>
        <a href="?lang=fr" hreflang="fr-CA" lang="fr-CA" title="Français">FR</a>
      </nav>
      <button type="button" class="theme-toggle" id="theme-toggle">
        <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    <div class="header-actions">
      <a class="btn btn--primary" data-href="header.githubUrl" href="https://github.com/opencairn-ai">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
        <span data-text="header.github"></span>
      </a>
    </div>
  </header>

  <main class="hello">
    <!-- The title, then the reason for Cairn and its three points: the same layout
         as the goal and its three points on the stack page. -->
    <section class="intro">
      <h1 data-text="intro.title"></h1>
      <div class="goal">
        <p class="goal__lead" data-text="hello.lead"></p>
        <ul class="goal__points" id="goal-points" data-points="hello.points"></ul>
      </div>
    </section>

    <!-- The marks of the pictures, which more than one picture uses. -->
    <svg class="pic-defs" width="0" height="0" aria-hidden="true">
      <symbol id="pic-pass" viewBox="0 0 16 16">
        <circle class="pic-pass__disc" cx="8" cy="8" r="8"/>
        <path class="pic-pass__mark" d="m4.4 8.3 2.4 2.4 4.8-5"/>
      </symbol>
      <symbol id="pic-fail" viewBox="0 0 16 16">
        <circle class="pic-fail__ring" cx="8" cy="8" r="7.2"/>
        <path class="pic-fail__mark" d="m5.4 5.4 5.2 5.2m0-5.2-5.2 5.2"/>
      </symbol>
    </svg>

    <!-- Two sections side by side: what Cairn is, then who Cairn is for. -->
    <div class="hello__cols">

      <section class="what">
        <p class="eyebrow" data-text="hello.what.eyebrow"></p>
        <h2 class="hello__title" data-text="hello.what.title"></h2>
        <p class="what__links">
          <a class="btn btn--primary" href="stack.html" data-page="stack" data-text="hello.what.stack"></a>
          <a class="btn" href="roadmap.html" data-page="roadmap" data-text="hello.what.roadmap"></a>
          <a class="what__mail" data-href="hello.what.contactUrl" data-text="hello.what.contact"></a>
        </p>

        <!-- The four principles, one at a time: a name, a description and a picture.
             The carousel goes to the next principle by itself. The script (js/hello.js)
             drives it and makes the marks under it, one for each principle.
             The texts are under `hello` in the copy files; the layer and component
             names in the pictures are the names of the schema, under `stack`. -->
        <div class="carousel" id="principles" role="group" data-aria-label="hello.carousel.label">
          <div class="carousel__slides">

            <!-- 1. Tests, then the selection. -->
            <article class="carousel__slide is-on">
              <div>
                <h3 class="carousel__name" data-text="hello.principles.0.name"></h3>
                <p class="carousel__text" data-text="hello.principles.0.text"></p>
              </div>
              <div class="carousel__picture" aria-hidden="true">
                <div class="pic pic-tests">
                  <div class="pic-tests__row pic-tests__row--head"><span class="pic__label" data-text="hello.pictures.tests.components"></span><span class="pic__label" data-text="hello.pictures.tests.tests"></span><span></span></div>
                  <div class="pic__box pic-tests__row"><span data-text="hello.pictures.tests.componentA"></span><span class="pic-tests__marks"><svg class="pic__mark"><use href="#pic-pass"/></svg><svg class="pic__mark"><use href="#pic-fail"/></svg><svg class="pic__mark"><use href="#pic-pass"/></svg></span><span></span></div>
                  <div class="pic__box pic-tests__row is-selected"><span data-text="hello.pictures.tests.componentB"></span><span class="pic-tests__marks"><svg class="pic__mark"><use href="#pic-pass"/></svg><svg class="pic__mark"><use href="#pic-pass"/></svg><svg class="pic__mark"><use href="#pic-pass"/></svg></span><span class="pic__tag" data-text="hello.pictures.tests.selected"></span></div>
                  <div class="pic__box pic-tests__row"><span data-text="hello.pictures.tests.componentC"></span><span class="pic-tests__marks"><svg class="pic__mark"><use href="#pic-fail"/></svg><svg class="pic__mark"><use href="#pic-pass"/></svg><svg class="pic__mark"><use href="#pic-pass"/></svg></span><span></span></div>
                </div>
              </div>
            </article>

            <!-- 2. One contract, and two places where one component can replace another one. -->
            <article class="carousel__slide">
              <div>
                <h3 class="carousel__name" data-text="hello.principles.1.name"></h3>
                <p class="carousel__text" data-text="hello.principles.1.text"></p>
              </div>
              <div class="carousel__picture" aria-hidden="true">
                <div class="pic pic-contract">
                  <div class="pic-contract__row">
                    <span class="pic-contract__place">
                      <span class="pic__label" data-text="stack.modelAccess.modelGateway.name"></span>
                      <span class="pic__box pic-contract__choice pic-contract__choice--c">LiteLLM <svg class="pic__mark"><use href="#pic-pass"/></svg></span>
                      <span class="pic-contract__or" data-text="hello.pictures.contract.or"></span>
                      <span class="pic__box pic-contract__choice pic-contract__choice--d">Otari <svg class="pic__mark"><use href="#pic-pass"/></svg></span>
                    </span>
                    <span class="pic-contract__joint"><span class="pic__label" data-text="hello.pictures.contract.contract"></span><i></i></span>
                    <span class="pic-contract__place">
                      <span class="pic__label" data-text="stack.modelAccess.modelServer.name"></span>
                      <span class="pic__box pic-contract__choice pic-contract__choice--a">vLLM <svg class="pic__mark"><use href="#pic-pass"/></svg></span>
                      <span class="pic-contract__or" data-text="hello.pictures.contract.or"></span>
                      <span class="pic__box pic-contract__choice pic-contract__choice--b">SGLang <svg class="pic__mark"><use href="#pic-pass"/></svg></span>
                    </span>
                  </div>
                  <ul class="pic__legend"><li><svg class="pic__mark"><use href="#pic-pass"/></svg><span data-text="hello.pictures.contract.passed"></span></li></ul>
                </div>
              </div>
            </article>

            <!-- 3. From top to bottom, as the schema: the tools of the teams, one API,
                 Cairn, then the compute that runs the AI models. -->
            <article class="carousel__slide">
              <div>
                <h3 class="carousel__name" data-text="hello.principles.2.name"></h3>
                <p class="carousel__text" data-text="hello.principles.2.text"></p>
              </div>
              <div class="carousel__picture" aria-hidden="true">
                <div class="pic pic-tools">
                  <div class="pic-tools__tools">
                    <span class="pic__box" data-text="hello.pictures.tools.chat"></span>
                    <span class="pic__box" data-text="hello.pictures.tools.coding"></span>
                    <span class="pic__box" data-text="hello.pictures.tools.applications"></span>
                  </div>
                  <svg class="pic-tools__lines" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M16.5 0C16.5 60 50 40 50 100"/><path d="M50 0V100"/><path d="M83.5 0C83.5 60 50 40 50 100"/></svg>
                  <div class="pic-tools__cairn"><i></i><span class="pic__label" data-text="hello.pictures.tools.api"></span><strong data-text="hello.pictures.tools.cairn"></strong><span data-text="hello.pictures.tools.where"></span></div>
                  <div class="pic-tools__compute">
                    <span class="pic__box"><b data-text="hello.pictures.tools.local"></b><small data-text="hello.pictures.tools.localDetail"></small></span>
                    <span class="pic__box"><b data-text="hello.pictures.tools.remote"></b><small data-text="hello.pictures.tools.remoteDetail"></small></span>
                  </div>
                  <p class="pic__label pic-tools__foot" data-text="hello.pictures.tools.compute"></p>
                </div>
              </div>
            </article>

            <!-- 4. The skeleton of the schema of the stack: the layers, their components
                 and the links between them. The component boxes have no names. -->
            <article class="carousel__slide">
              <div>
                <h3 class="carousel__name" data-text="hello.principles.3.name"></h3>
                <p class="carousel__text" data-text="hello.principles.3.text"></p>
              </div>
              <div class="carousel__picture" aria-hidden="true">
                <div class="pic pic-skeleton">
                  <div class="pic-skeleton__core">
                    <div class="pic-skeleton__matrix">
                      <div class="pic-skeleton__layer"><span class="pic-skeleton__name" data-text="stack.agentRuntime.name"></span><span class="pic-skeleton__comps"><i class="pic-skeleton__comp"></i><b class="pic-skeleton__link"></b><i class="pic-skeleton__comp"></i></span></div>
                      <b class="pic-skeleton__link pic-skeleton__link--across"></b>
                      <div class="pic-skeleton__layer"><span class="pic-skeleton__name" data-text="stack.persistence.name"></span><span class="pic-skeleton__comps"><i class="pic-skeleton__comp"></i><b class="pic-skeleton__link"></b><i class="pic-skeleton__comp"></i></span></div>
                      <b class="pic-skeleton__link pic-skeleton__link--down"></b><span></span><b class="pic-skeleton__link pic-skeleton__link--down"></b>
                      <div class="pic-skeleton__layer"><span class="pic-skeleton__name" data-text="stack.modelAccess.name"></span><span class="pic-skeleton__comps"><i class="pic-skeleton__comp"></i><b class="pic-skeleton__link"></b><i class="pic-skeleton__comp"></i></span></div>
                      <b class="pic-skeleton__link pic-skeleton__link--across"></b>
                      <div class="pic-skeleton__layer"><span class="pic-skeleton__name" data-text="stack.toolAccess.name"></span><span class="pic-skeleton__comps"><i class="pic-skeleton__comp"></i><b class="pic-skeleton__link"></b><i class="pic-skeleton__comp pic-skeleton__comp--specification"></i></span></div>
                    </div>
                    <div class="pic-skeleton__layer pic-skeleton__layer--row"><span class="pic-skeleton__name" data-text="stack.registry.name"></span><span class="pic-skeleton__comps"><i class="pic-skeleton__comp"></i><i class="pic-skeleton__comp"></i><i class="pic-skeleton__comp"></i><i class="pic-skeleton__comp"></i></span></div>
                  </div>
                  <div class="pic-skeleton__cross"><span data-text="stack.security.name"></span><span data-text="stack.observability.name"></span><span data-text="stack.controlPlane.name"></span></div>
                  <ul class="pic__legend">
                    <li><i class="pic__key pic__key--component"></i><span data-text="hello.pictures.skeleton.component"></span></li>
                    <li><i class="pic__key pic__key--link"></i><span data-text="hello.pictures.skeleton.code"></span></li>
                    <li><i class="pic__key pic__key--specification"></i><span data-text="hello.pictures.skeleton.specification"></span></li>
                  </ul>
                </div>
              </div>
            </article>

          </div>

          <!-- The marks (one for each principle, made by the script), then the
               buttons. The script gives the pause button its name. -->
          <div class="carousel__nav">
            <div class="carousel__marks"></div>
            <button type="button" class="carousel__button" data-carousel="previous" data-aria-label="hello.carousel.previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
            <button type="button" class="carousel__button" data-carousel="toggle">
              <svg class="carousel__icon carousel__icon--pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
              <svg class="carousel__icon carousel__icon--play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button type="button" class="carousel__button" data-carousel="next" data-aria-label="hello.carousel.next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
          </div>
        </div>
      </section>

      <!-- The types of adopter, each with one line. The script (js/hello.js) makes
           the rows from `hello.who.adopters` in the copy files. -->
      <section class="who">
        <p class="eyebrow" data-text="hello.who.eyebrow"></p>
        <h2 class="hello__title" data-text="hello.who.title"></h2>
        <dl class="adopters" id="adopters"></dl>
      </section>

    </div>
  </main>

  <footer class="site-footer">
    <p id="collaboration"></p>
  </footer>

</div>

<script src="copy/en.js"></script>
<script src="copy/fr.js"></script>
<script src="js/app.js"></script>
<script src="js/hello.js"></script>
</body>
</html>
