<body data-page="hello">
<div class="page">

  <header class="site-header">
    <a class="codename" href="./" data-page="hello"><img class="logo--light" src="assets/cairn-logo-light.png" alt="Codename: Cairn" width="846" height="104"><img class="logo--dark" src="assets/cairn-logo-dark.png" alt="Codename: Cairn" width="846" height="104"></a>
    <!-- The tabs, in the header row after the logo: the same four links on every
         page. The script marks the current one. -->
    <nav class="site-nav" data-aria-label="nav.label">
      <a href="./" data-page="hello" data-text="nav.hello"></a>
      <a href="stack.html" data-page="stack" data-text="nav.stack"></a>
      <a href="recipes.html" data-page="recipes" data-text="nav.recipes"></a>
      <a href="roadmap.html" data-page="roadmap" data-text="nav.roadmap"></a>
    </nav>
    <div class="header-actions">
      <!-- The contact link: a button with no border, before the GitHub button. -->
      <a class="btn btn--ghost" data-href="header.contactUrl" href="mailto:bonjourhi@opencairn.ai" data-text="header.contact"></a>
      <a class="btn btn--primary" data-href="header.githubUrl" href="https://github.com/opencairn-ai">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
        <span data-text="header.github"></span>
      </a>
    </div>
    <div class="prefs">
      <!-- One language button: the script hides the link to the current language,
           so the button shows the language a click switches to. -->
      <nav class="lang" data-aria-label="header.languageLabel">
        <a href="?lang=en" hreflang="en" lang="en" title="English">EN</a>
        <a href="?lang=fr" hreflang="fr-CA" lang="fr-CA" title="Français">FR</a>
      </nav>
      <button type="button" class="theme-toggle" id="theme-toggle">
        <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <!-- Trail map from the frame: the light dither on cream, or the full dark
       background exported from frame 28:11033. Clipped so it ends with the footer. -->
  <div class="hello-ground-clip">
    <div class="hello-ground__degrade" aria-hidden="true"></div>
    <div class="hello-ground-stack hello-ground-stack--light" aria-hidden="true">
      <object class="hello-ground hello-ground__dither" type="image/svg+xml" data="assets/hello/trail-dither.svg?v=10292" width="1177" height="1440"></object>
    </div>
    <!-- Dark portrait exports, kept for the fallback; the dark theme uses the
         full landscape background on .hello-ground__degrade instead. -->
    <div class="hello-ground-stack hello-ground-stack--dark" aria-hidden="true">
      <object class="hello-ground hello-ground__terrain" type="image/svg+xml" data="assets/hello/trail-dark-terrain.svg?v=11035" width="1101" height="1444"></object>
      <object class="hello-ground hello-ground__contour hello-ground__contour--dark" type="image/svg+xml" data="assets/hello/trail-dark-contour.svg?v=11503" width="1442" height="634"></object>
    </div>
    <object class="hello-ground hello-ground__contour" type="image/svg+xml" data="assets/hello/trail-contour.svg?v=10770" width="1442" height="634" aria-hidden="true"></object>
  </div>

  <main class="hello">
    <div class="hello__hero">
      <h1 class="hello__heading">
        <span class="hello__title-line" data-text="hello.title.line"></span>
        <span class="hello__title-line"><span data-text="hello.title.before"></span><em class="hello__title-mark" data-text="hello.title.mark"></em><span data-text="hello.title.after"></span></span>
      </h1>

      <section class="hello__intro">
        <div class="hello__deck">
          <p class="hello__lead" data-text="hello.lead"></p>
          <p class="hello__lead hello__lead--mark" data-text="hello.what.title"></p>
        </div>
        <p class="what__links">
          <a class="btn" href="stack.html" data-page="stack">
            <img src="assets/hello/explore.svg?v=5421" alt="" width="18" height="18">
            <span data-text="hello.what.stack"></span>
          </a>
          <a class="what__pebble" data-href="hello.what.contactUrl" data-text="hello.what.contact"></a>
        </p>
      </section>
    </div>

    <!-- Marks shared by the pictures. -->
    <svg class="pic-defs" width="0" height="0" aria-hidden="true">
      <symbol id="pic-pass" viewBox="0 0 16 16">
        <circle cx="8" cy="8" r="8" fill="var(--mark-pass, #5c7065)"/>
        <path d="m4.4 8.3 2.4 2.4 4.8-5" fill="none" stroke="var(--mark-pass-ink, var(--color-component))" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="pic-fail" viewBox="0 0 16 16">
        <circle cx="8" cy="8" r="7.2" fill="none" stroke="var(--mark-fail, var(--color-text-muted))" stroke-width="1.3"/>
        <path d="m5.4 5.4 5.2 5.2m0-5.2-5.2 5.2" fill="none" stroke="var(--mark-fail, var(--color-text-muted))" stroke-width="1.5" stroke-linecap="round"/>
      </symbol>
    </svg>

    <!-- The four principles on the left. One is open. Its picture is on the right.
         The carousel moves to the next principle on its own. A click opens that
         principle and its picture, and so does a click on its mark in the corner of
         the frame. js/hello.js drives both. -->
    <section class="hello__approach">
      <h2 class="hello__approach-title" data-text="hello.carousel.label"></h2>
      <div class="approach">
        <div class="approach__list" id="principles" role="list"></div>
        <div class="approach__stage">
          <div class="carousel__slide" data-picture="0">
            <div class="pic pic-tests">
              <div class="pic-tests__head">
                <span class="pic__label" data-text="hello.pictures.tests.components"></span>
                <span class="pic__label" data-text="hello.pictures.tests.tests"></span>
              </div>
              <div class="pic-tests__rows">
                <div class="pic__box pic-tests__row"><span data-text="hello.pictures.tests.componentA"></span><span class="pic-tests__marks"><img class="pic__mark" src="assets/hello/pic-pass.svg" alt="" width="26" height="26"><img class="pic__mark" src="assets/hello/pic-fail.svg" alt="" width="26" height="26"><img class="pic__mark" src="assets/hello/pic-pass.svg" alt="" width="26" height="26"></span><span class="pic-tests__slot" aria-hidden="true"></span></div>
                <div class="pic__box pic-tests__row is-selected"><span data-text="hello.pictures.tests.componentB"></span><span class="pic-tests__marks"><img class="pic__mark" src="assets/hello/pic-pass.svg" alt="" width="26" height="26"><img class="pic__mark" src="assets/hello/pic-pass.svg" alt="" width="26" height="26"><img class="pic__mark" src="assets/hello/pic-pass.svg" alt="" width="26" height="26"></span><span class="pic__tag" data-text="hello.pictures.tests.selected"></span></div>
                <div class="pic__box pic-tests__row"><span data-text="hello.pictures.tests.componentC"></span><span class="pic-tests__marks"><img class="pic__mark" src="assets/hello/pic-fail.svg" alt="" width="26" height="26"><img class="pic__mark" src="assets/hello/pic-pass.svg" alt="" width="26" height="26"><img class="pic__mark" src="assets/hello/pic-pass.svg" alt="" width="26" height="26"></span><span class="pic-tests__slot" aria-hidden="true"></span></div>
              </div>
            </div>
          </div>
          <div class="carousel__slide" data-picture="1">
            <div class="pic pic-contract">
              <div class="pic-contract__grid">
                <i class="pic-contract__frame pic-contract__frame--gateway"></i>
                <i class="pic-contract__frame pic-contract__frame--server"></i>
                <span class="pic__label pic-contract__name pic-contract__name--gateway" data-text="stack.modelAccess.modelGateway.name"></span>
                <span class="pic__label pic-contract__name pic-contract__name--server" data-text="stack.modelAccess.modelServer.name"></span>
                <i class="pic-contract__slot pic-contract__slot--gateway"></i>
                <i class="pic-contract__slot pic-contract__slot--server"></i>
                <span class="pic-contract__joint">
                  <span class="pic__label pic-contract__joint-label">
                    <span data-text="hello.pictures.contract.interface"></span>
                    <span data-text="hello.pictures.contract.contractWord"></span>
                  </span>
                </span>
                <span class="pic__box pic-contract__choice pic-contract__choice--gateway pic-contract__choice--in">LiteLLM <img class="pic__mark-contract" src="assets/hello/pic-pass-contract.svg" alt="" width="21.42" height="21.42"></span>
                <span class="pic__box pic-contract__choice pic-contract__choice--gateway pic-contract__choice--out">Otari <img class="pic__mark-contract" src="assets/hello/pic-pass-contract.svg" alt="" width="21.42" height="21.42"></span>
                <span class="pic__box pic-contract__choice pic-contract__choice--server pic-contract__choice--in">vLLM <img class="pic__mark-contract" src="assets/hello/pic-pass-contract.svg" alt="" width="21.42" height="21.42"></span>
                <span class="pic__box pic-contract__choice pic-contract__choice--server pic-contract__choice--out">SGLang <img class="pic__mark-contract" src="assets/hello/pic-pass-contract.svg" alt="" width="21.42" height="21.42"></span>
              </div>
              <ul class="pic__legend"><li><img class="pic__mark-contract" src="assets/hello/pic-pass-contract.svg" alt="" width="21.42" height="21.42"><span data-text="hello.pictures.contract.passed"></span></li></ul>
            </div>
          </div>
          <div class="carousel__slide" data-picture="2">
            <div class="pic pic-tools">
              <div class="pic-tools__tools">
                <span class="pic__box" data-text="hello.pictures.tools.chat"></span>
                <span class="pic__box" data-text="hello.pictures.tools.coding"></span>
                <span class="pic__box" data-text="hello.pictures.tools.applications"></span>
              </div>
              <svg class="pic-tools__lines" id="flow-tools" viewBox="0 0 300 22">
                <path id="flow-chat" d="M48.5 0C48.5 14 150 8 150 22"/>
                <path id="flow-coding" d="M150 0V22"/>
                <path id="flow-applications" d="M251.5 0C251.5 14 150 8 150 22"/>
                <circle class="pic-tools__api" cx="150" cy="22" r="3"/>
              </svg>
              <div class="pic-tools__cairn"><span class="pic__label" data-text="hello.pictures.tools.api"></span><strong data-text="hello.pictures.tools.cairn"></strong><span data-text="hello.pictures.tools.where"></span></div>
              <svg class="pic-tools__lines" id="flow-compute" viewBox="0 0 300 11">
                <path id="flow-local" d="M73.75 0V11"/>
                <path id="flow-remote" d="M226.25 0V11"/>
              </svg>
              <div class="pic-tools__compute">
                <span class="pic__box"><b data-text="hello.pictures.tools.local"></b><small data-text="hello.pictures.tools.localDetail"></small></span>
                <span class="pic__box"><b data-text="hello.pictures.tools.remote"></b><small data-text="hello.pictures.tools.remoteDetail"></small></span>
              </div>
              <p class="pic__label pic-tools__foot" data-text="hello.pictures.tools.compute"></p>
            </div>
          </div>
          <div class="carousel__slide" data-picture="3">
            <div class="pic pic-skeleton">
              <div class="pic-skeleton__core">
                <div class="pic-skeleton__matrix">
                  <div class="pic-skeleton__layer" style="--n: 0"><span class="pic-skeleton__name" data-text="stack.agentRuntime.name"></span><span class="pic-skeleton__comps"><i class="pic-skeleton__comp"></i><b class="pic-skeleton__link"></b><i class="pic-skeleton__comp"></i></span></div>
                  <b class="pic-skeleton__link pic-skeleton__link--across"></b>
                  <div class="pic-skeleton__layer" style="--n: 1"><span class="pic-skeleton__name" data-text="stack.persistence.name"></span><span class="pic-skeleton__comps"><i class="pic-skeleton__comp"></i><b class="pic-skeleton__link"></b><i class="pic-skeleton__comp"></i></span></div>
                  <b class="pic-skeleton__link pic-skeleton__link--down"></b><span></span><b class="pic-skeleton__link pic-skeleton__link--down"></b>
                  <div class="pic-skeleton__layer" style="--n: 2"><span class="pic-skeleton__name" data-text="stack.modelAccess.name"></span><span class="pic-skeleton__comps"><i class="pic-skeleton__comp"></i><b class="pic-skeleton__link"></b><i class="pic-skeleton__comp"></i></span></div>
                  <b class="pic-skeleton__link pic-skeleton__link--across"></b>
                  <div class="pic-skeleton__layer" style="--n: 3"><span class="pic-skeleton__name" data-text="stack.toolAccess.name"></span><span class="pic-skeleton__comps"><i class="pic-skeleton__comp"></i><b class="pic-skeleton__link"></b><i class="pic-skeleton__comp pic-skeleton__comp--specification"></i></span></div>
                </div>
                <div class="pic-skeleton__layer pic-skeleton__layer--row" style="--n: 4"><span class="pic-skeleton__name" data-text="stack.registry.name"></span><span class="pic-skeleton__comps"><i class="pic-skeleton__comp"></i><i class="pic-skeleton__comp"></i><i class="pic-skeleton__comp"></i><i class="pic-skeleton__comp"></i></span></div>
              </div>
              <div class="pic-skeleton__cross"><span data-text="stack.security.name"></span><span data-text="stack.observability.name"></span><span data-text="stack.controlPlane.name"></span></div>
              <ul class="pic__legend">
                <li><i class="pic__key pic__key--component"></i><span data-text="hello.pictures.skeleton.component"></span></li>
                <li><i class="pic__key pic__key--link"></i><span data-text="hello.pictures.skeleton.code"></span></li>
                <li><i class="pic__key pic__key--specification"></i><span data-text="hello.pictures.skeleton.specification"></span></li>
              </ul>
            </div>
          </div>
          <div class="approach__dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-brand" id="collaboration"></div>
    <div class="footer-actions">
      <a class="btn footer-btn" data-href="footer.reportUrl" data-text="footer.report"></a>
      <a class="btn footer-btn footer-btn--line" data-href="footer.contactUrl" data-text="footer.contact"></a>
    </div>
  </footer>

</div>

<script src="copy/en.js?v=109"></script>

<script src="js/app.js?v=85"></script>
