<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f9f6f1">
<script>
  // Sets the theme before the first paint: the visitor's last choice, else the system setting.
  (function () {
    var theme;
    try { theme = localStorage.getItem("cairn-theme"); } catch (e) {}
    if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = theme;
  })();
</script>
<!-- Title and description are replaced at load time from copy/en.js or copy/fr.js;
     the English values here serve link previews and crawlers that do not run scripts. -->
<title>Cairn: Hello World</title>
<meta name="description" content="An open architecture to run AI models and agents on infrastructure that your organization controls. Components follow clear interface contracts, so you do not depend on one project or vendor. A Mozilla × Mila research collaboration.">
<meta property="og:type" content="website">
<meta property="og:title" content="Cairn: Hello World">
<meta property="og:description" content="An open architecture to run AI models and agents on infrastructure that your organization controls. Components follow clear interface contracts, so you do not depend on one project or vendor. A Mozilla × Mila research collaboration.">
<meta property="og:url" content="https://opencairn.ai/">
<!-- Share card: supplied image at public/assets/og-card.png. The HTML in reference/og-card/ is the previous card. -->
<meta property="og:image" content="https://opencairn.ai/assets/og-card.png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="537">
<meta property="og:image:alt" content="The sovereign, open source AI stack. A Mozilla × Mila research collaboration.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://opencairn.ai/assets/og-card.png">
<link rel="canonical" href="https://opencairn.ai/">
<link rel="alternate" hreflang="en" href="https://opencairn.ai/?lang=en">
<link rel="alternate" hreflang="fr-CA" href="https://opencairn.ai/?lang=fr">
<link rel="alternate" hreflang="x-default" href="https://opencairn.ai/">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preload" href="fonts/SpaceGrotesk-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="hello">
<div class="page">

  <header class="site-header">
    <a class="codename" href="./" data-page="hello"><img class="logo--light" src="assets/cairn-logo-light.png" alt="Codename: Cairn" width="846" height="104"><img class="logo--dark" src="assets/cairn-logo-dark.png" alt="Codename: Cairn" width="846" height="104"></a>
    <!-- The tabs: the same four links on every page. The script marks the current one. -->
    <nav class="site-nav" data-aria-label="nav.label">
      <a href="./" data-page="hello" data-text="nav.hello"></a>
      <a href="stack.html" data-page="stack" data-text="nav.stack"></a>
      <a href="recipes.html" data-page="recipes" data-text="nav.recipes"></a>
      <a href="roadmap.html" data-page="roadmap" data-text="nav.roadmap"></a>
    </nav>
    <div class="prefs">
      <!-- One language button: the script hides the link to the current language,
           so the button shows the language a click switches to. -->
      <nav class="lang" data-aria-label="header.languageLabel">
        <a href="?lang=en" hreflang="en" lang="en" title="English">EN</a>
        <a href="?lang=fr" hreflang="fr-CA" lang="fr-CA" title="Français">FR</a>
      </nav>
      <button type="button" class="theme-toggle" id="theme-toggle">
        <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    <div class="header-actions">
      <a class="btn btn--primary" data-href="header.githubUrl" href="https://github.com/opencairn-ai">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
        <span data-text="header.github"></span>
      </a>
    </div>
  </header>

  <main>
    <!-- The title of the page. The goal and its three points are on the stack page. -->
    <section class="intro">
      <h1 data-text="intro.title"></h1>
    </section>

    <!-- The animation: a task goes through the layers of Cairn and the result comes
         back; then one component is replaced by another one. It plays in a loop. It
         has no text above it: the title of the page does that.
         The script (js/flow.js) plays it. Its texts are under `flow` in the copy
         files; the layer and component names are the names of the schema. -->
    <figure class="flow" id="flow" data-aria-label="flow.label">
      <!-- The pictures that the animation uses in more than one place. -->
      <svg class="flow__defs" width="0" height="0" aria-hidden="true">
        <symbol id="flow-answer" viewBox="0 0 20 18">
          <path class="flow-answer__bubble" d="M3 1.5h14a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5H9.5l-4 4v-4H3A1.5 1.5 0 0 1 1.5 11V3A1.5 1.5 0 0 1 3 1.5z"/>
          <path class="flow-answer__lines" d="M5.5 5.5h9M5.5 8.6h6"/>
        </symbol>
        <symbol id="flow-check" viewBox="0 0 16 16">
          <circle class="flow-check__disc" cx="8" cy="8" r="8"/>
          <path class="flow-check__mark" d="m4.4 8.3 2.4 2.4 4.8-5"/>
        </symbol>
      </svg>

      <!-- Pause and play. The script gives the button its name. -->
      <button type="button" class="flow__toggle" data-state="play">
        <svg class="flow__icon flow__icon--play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="flow__icon flow__icon--pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
      </button>

      <div class="flow__stage" aria-hidden="true">

        <!-- The client side: you and your AI agent, a chat window. -->
        <div class="flow__actor">
          <div class="flow__agent">
            <svg class="flow__person" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21.5a8.5 8.5 0 0 1 17 0"/></svg>
            <div class="flow__chat" data-anchor="chat">
              <span class="flow__chat-bar"><i></i><i></i><i></i></span>
              <span class="flow__msg flow__msg--task"></span>
              <span class="flow__msg flow__msg--answer"></span>
            </div>
          </div>
          <p class="flow__actor-name" data-text="flow.agent"></p>
        </div>

        <!-- The server side: the stack, on infrastructure that you control. -->
        <div class="flow__area">
          <p class="flow__area-name" data-text="flow.area"></p>
          <div class="flow__stack">
            <div class="flow__core">
              <p class="flow__stack-name" data-text="flow.stack"></p>
              <div class="flow__layer" data-anchor="agentRuntime">
                <p class="flow__layer-name" data-text="stack.agentRuntime.name"></p>
                <span class="flow__comp"><span class="flow__comp-name" data-text="stack.agentRuntime.localToolServer.name"></span></span>
                <span class="flow__comp"><span class="flow__comp-name" data-text="stack.agentRuntime.sandbox.name"></span></span>
                <span class="flow__joint flow__joint--right" data-anchor="persistence-agentRuntime"></span>
                <span class="flow__joint flow__joint--bottom" data-anchor="agentRuntime-modelAccess"></span>
              </div>
              <div class="flow__layer" data-anchor="persistence">
                <p class="flow__layer-name" data-text="stack.persistence.name"></p>
                <span class="flow__comp"><span class="flow__comp-name" data-text="stack.persistence.semanticSearch.name"></span></span>
                <span class="flow__comp"><span class="flow__comp-name" data-text="stack.persistence.agentMemory.name"></span></span>
              </div>
              <div class="flow__layer" data-anchor="modelAccess">
                <p class="flow__layer-name" data-text="stack.modelAccess.name"></p>
                <span class="flow__comp"><span class="flow__comp-name" data-text="stack.modelAccess.modelGateway.name"></span></span>
                <!-- The component that the animation replaces: the two model servers of
                     the Alpha release, one after the other. -->
                <span class="flow__slot">
                  <span class="flow__comp flow__comp--a"><span class="flow__comp-name" data-text="stack.modelAccess.modelServer.name"></span><span class="flow__impl">vLLM</span></span>
                  <span class="flow__comp flow__comp--b"><span class="flow__comp-name" data-text="stack.modelAccess.modelServer.name"></span><span class="flow__impl">SGLang</span></span>
                </span>
              </div>
              <div class="flow__layer" data-anchor="toolAccess">
                <p class="flow__layer-name" data-text="stack.toolAccess.name"></p>
                <span class="flow__comp"><span class="flow__comp-name" data-text="stack.toolAccess.toolGateway.name"></span></span>
                <span class="flow__comp"><span class="flow__comp-name" data-text="stack.toolAccess.toolServer.name"></span></span>
                <span class="flow__joint flow__joint--top" data-anchor="toolAccess-persistence"></span>
                <span class="flow__joint flow__joint--left" data-anchor="modelAccess-toolAccess"></span>
              </div>
            </div>
            <p class="flow__cross">
              <span data-text="stack.security.name"></span>
              <span data-text="stack.observability.name"></span>
              <span data-text="stack.controlPlane.name"></span>
            </p>
          </div>
        </div>

        <!-- What the two signs of the picture mean. -->
        <ul class="flow__legend">
          <li><span class="flow__key"><i class="flow__key-contract"></i></span><span data-text="flow.contract"></span></li>
          <li><span class="flow__key"><svg viewBox="0 0 16 16"><use href="#flow-check"/></svg></span><span data-text="flow.tested"></span></li>
        </ul>

        <!-- From your AI agent to the API Endpoint of the stack. -->
        <span class="flow__link"></span>

        <!-- What moves: the task and the result. -->
        <span class="flow__packet flow__packet--task" data-packet="task"></span>
        <svg class="flow__packet flow__packet--answer" data-packet="answer" viewBox="0 0 20 18"><use href="#flow-answer"/></svg>
      </div>

      <p class="sr-only" data-text="flow.description"></p>
    </figure>
  </main>

  <footer class="site-footer">
    <p id="collaboration"></p>
  </footer>

</div>

<script src="copy/en.js"></script>
<script src="copy/fr.js"></script>
<script src="js/app.js"></script>
<script src="js/flow.js"></script>
</body>
</html>
