<body data-page="stack">
<div class="page">

  <header class="site-header">
    <a class="codename" href="./" data-page="hello"><img class="logo--light" src="assets/cairn-logo-light.png" alt="Codename: Cairn" width="846" height="104"><img class="logo--dark" src="assets/cairn-logo-dark.png" alt="Codename: Cairn" width="846" height="104"></a>
    <!-- The tabs, in the header row after the logo: the same four links on every
         page. The script marks the current one. -->
    <nav class="site-nav" data-aria-label="nav.label">
      <a href="./" data-page="hello" data-text="nav.hello"></a>
      <a href="stack.html" data-page="stack" data-text="nav.stack"></a>
      <a href="recipes.html" data-page="recipes" data-text="nav.recipes"></a>
      <a href="roadmap.html" data-page="roadmap" data-text="nav.roadmap"></a>
    </nav>
    <div class="header-actions">
      <!-- The contact link: a button with no border, before the GitHub button. -->
      <a class="btn btn--ghost" data-href="header.contactUrl" href="mailto:bonjourhi@opencairn.ai" data-text="header.contact"></a>
      <a class="btn btn--primary" data-href="header.githubUrl" href="https://github.com/opencairn-ai">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
        <span data-text="header.github"></span>
      </a>
    </div>
    <div class="prefs">
      <!-- One language button: the script hides the link to the current language,
           so the button shows the language a click switches to. -->
      <nav class="lang" data-aria-label="header.languageLabel">
        <a href="?lang=en" hreflang="en" lang="en" title="English">EN</a>
        <a href="?lang=fr" hreflang="fr-CA" lang="fr-CA" title="Français">FR</a>
      </nav>
      <button type="button" class="theme-toggle" id="theme-toggle">
        <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main>
    <!-- The title of the page, then the goal and its three points. -->
    <section class="intro">
      <h1 data-text="diagram.title"></h1>
      <div class="goal">
        <p class="goal__lead" data-text="intro.goal"></p>
        <ul class="goal__points" id="goal-points"></ul>
      </div>
    </section>

    <figure class="arch-figure">
      <figcaption class="arch-caption">
        <h2 class="stack-heading" data-text="diagram.heading"></h2>
        <!-- The hint, and on wide screens the button that hides or shows the sheet. -->
        <div class="stack-caption">
          <p class="hint stack-hint" data-text="diagram.hint"></p>
          <button type="button" class="sheet-toggle" id="sheet-toggle" aria-controls="stack-sheet" aria-expanded="true">
            <span class="sheet-toggle__label" data-text="diagram.sheet.title"></span>
            <span class="sheet-toggle__chevron" aria-hidden="true"></span>
          </button>
        </div>
        <ul class="legend" id="status-legend"></ul>
      </figcaption>

      <!-- The architecture. Each data-copy value points to an entry under `stack`
           in the copy files, which provides its name and pop-up text.
           data-release="alpha" records the components in the Alpha release, for
           the roadmap. This view does not show it. To show a mark on a box (and
           its layer), give the box data-status instead; its label is in the copy
           files. -->
      <!-- The schema on the left, the sheet of the selected box on the right
           (wide screens; narrow screens keep the pop-ups). -->
      <div class="stack-body">
      <div class="arch" id="architecture" role="group" data-aria-label="diagram.label">

        <!-- The client side: one row, with no detail. Cairn does not cover it. -->
        <div class="layer layer--client is-out-of-scope" data-copy="application"></div>

        <div class="boundary">
          <span class="boundary__label is-out-of-scope" data-copy="local"><svg class="boundary__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></span>
          <div class="boundary__line">
            <div class="local-api" data-copy="localApi">
              <span class="local-api__dot" aria-hidden="true"></span>
            </div>
          </div>
          <span class="boundary__label" data-copy="server"><svg class="boundary__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg></span>
          <span class="api-bridge" aria-hidden="true">
            <span class="api-bridge__dots"></span>
            <span class="api-bridge__pulse"></span>
          </span>
        </div>

        <!-- The core: four layers in a matrix (two columns, two rows), and the Registry row under all four. -->
        <div class="core">
          <div class="layer layer--stack" data-copy="agentRuntime">
            <div class="layer__items">
              <div class="comp" data-copy="agentRuntime.localToolServer"></div>
              <div class="comp" data-copy="agentRuntime.sandbox"></div>
            </div>
          </div>

          <div class="layer layer--stack" data-copy="persistence">
            <div class="layer__items">
              <div class="comp" data-copy="persistence.semanticSearch"></div>
              <div class="comp" data-copy="persistence.agentMemory"></div>
            </div>
          </div>

          <div class="layer layer--stack" data-copy="modelAccess">
            <div class="layer__items">
              <div class="comp" data-copy="modelAccess.modelGateway" data-release="alpha"></div>
              <div class="comp" data-copy="modelAccess.modelServer" data-release="alpha"></div>
            </div>
          </div>

          <div class="layer layer--stack" data-copy="toolAccess">
            <div class="layer__items">
              <div class="comp" data-copy="toolAccess.toolGateway"></div>
              <div class="comp" data-copy="toolAccess.toolServer"></div>
            </div>
          </div>

          <div class="layer layer--row layer--registry" data-copy="registry">
            <div class="layer__items">
              <div class="comp" data-copy="registry.skillRegistry"></div>
              <div class="comp" data-copy="registry.promptRegistry"></div>
              <div class="comp" data-copy="registry.modelRegistry"></div>
              <div class="comp" data-copy="registry.toolRegistry"></div>
            </div>
          </div>
        </div>

        <!-- The cross-cutting layers: one group with a name, each layer a full-width row. -->
        <div class="cross">
          <p class="cross-label" data-text="diagram.crossLabel"></p>

          <div class="layer layer--row layer--cross" data-copy="security">
            <div class="layer__items">
              <div class="comp" data-copy="security.iam" data-release="alpha"></div>
              <div class="comp" data-copy="security.guardrails"></div>
              <div class="comp" data-copy="security.registryScanners"></div>
            </div>
          </div>

          <div class="layer layer--row layer--cross" data-copy="observability">
            <div class="layer__items">
              <div class="comp" data-copy="observability.telemetry" data-release="alpha"></div>
              <div class="comp" data-copy="observability.costUsage" data-release="alpha"></div>
              <div class="comp" data-copy="observability.agentTracing"></div>
            </div>
          </div>

          <div class="layer layer--row layer--cross layer--control" data-copy="controlPlane">
            <div class="layer__items">
              <div class="comp" data-copy="controlPlane.adminConsole"></div>
              <div class="comp" data-copy="controlPlane.deployment" data-release="alpha"></div>
              <div class="comp" data-copy="controlPlane.policyTenancy"></div>
              <div class="comp" data-copy="controlPlane.magicModel" data-release="alpha"></div>
            </div>
          </div>
        </div>

      </div>
      <aside class="stack-sheet" id="stack-sheet" aria-live="polite"></aside>
      </div>
    </figure>
  </main>

  <footer class="site-footer">
    <div class="footer-brand" id="collaboration"></div>
    <div class="footer-actions">
      <a class="btn footer-btn" data-href="footer.reportUrl" data-text="footer.report"></a>
      <a class="btn footer-btn footer-btn--line" data-href="footer.contactUrl" data-text="footer.contact"></a>
    </div>
  </footer>

</div>

<div class="tip" id="tip" aria-hidden="true">
  <!-- Phone panel only. The pop-up is hidden from screen readers (they get each
       description inline), so this button is a tap target, not a focus stop. -->
  <button type="button" class="tip__close" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.758 17.243 12 12m5.243-5.243L12 12m0 0L6.758 6.757M12 12l5.243 5.243"/></svg></button>
  <p class="tip__kind"></p>
  <p class="tip__name"></p>
  <p class="tip__status"><span class="pill"></span></p>
  <p class="tip__text"></p>
</div>
