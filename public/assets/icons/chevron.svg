<!-- The arrow of the card buttons (LaStack, Model Recipes). It points right when
     the card is closed; the CSS turns it down when the card is open. Only its shape
     counts: the CSS paints it in the text color, so any color here is ignored. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
