# Publishes the site to GitHub Pages (opencairn.ai) on every push to main.
# Only public/ is uploaded: the other files of the repository are not part of the site.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Publish again without a new commit (Actions tab > Run workflow, from main).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push waits; it does not cancel a deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
